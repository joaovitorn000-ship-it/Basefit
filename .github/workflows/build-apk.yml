name: Gerar APK do BaseFit
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q basefit-apk-projeto.zip -d projeto
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        working-directory: projeto
        run: npm install
      - name: Criar projeto Android
        working-directory: projeto
        run: npx cap add android
      - name: Ajustar ícones e permissões
        working-directory: projeto
        run: python3 scripts/patch_android.py .
      - name: Sincronizar
        working-directory: projeto
        run: npx cap sync android
      - name: Compilar APK
        working-directory: projeto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BaseFit-APK
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
